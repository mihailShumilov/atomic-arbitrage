services:
  clickhouse:
    # Pinned (task 023): 26.9.6.6 is the version that created data/clickhouse
    # (SELECT version() on 2026-10-02; image sha256:eb4870e7ca7e...). Upgrade deliberately:
    # new tag here, then sql/apply.sh and a DESCRIBE check, never via a floating tag.
    image: clickhouse/clickhouse-server:26.9.6.6
    # Unique host ports (other local projects use 8123/9000); loopback only.
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${CLICKHOUSE_TCP_PORT:-19100}:9000"
    environment:
      CLICKHOUSE_USER: hood
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # Schema is NOT applied by docker-entrypoint-initdb.d (that runs only on an empty volume and
    # keeps no record). After `docker compose up -d clickhouse` run sql/apply.sh: it applies
    # pending sql/NNN_*.sql migrations and records them in hood.schema_migrations.
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
