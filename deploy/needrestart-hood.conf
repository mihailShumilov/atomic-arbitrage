# hoodchain-mev: never let needrestart (apt / unattended-upgrades) restart the
# recorder; every restart stops the feed for ~2 min (the recorder waits
# --min-connect-interval-secs 120 after the stop; the feed backlog covers only
# ~60-70 s, the rest becomes a gap). Restart it by hand
# (see deploy/README.md, "Обновление"). Installed as
# /etc/needrestart/conf.d/hood.conf by bootstrap.sh.
$nrconf{override_rc}{qr(^recorder\.service$)} = 0;
