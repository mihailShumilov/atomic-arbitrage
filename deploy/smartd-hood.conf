# hoodchain-mev: smartd configuration (task 015). Installed by bootstrap.sh as
# /etc/hoodchain/smartd.conf; smartmontools.service reads it through the
# drop-in smartd-hood.service.conf (ExecStart ... -c /etc/hoodchain/smartd.conf).
# The packaged /etc/smartd.conf (a dpkg conffile) is left untouched.
#
# One line for every disk smartd finds (hood-rec: 2 x SATA HDD in RAID1):
#   -a              health status, attribute thresholds/changes, error and
#                   self-test logs, pending (197) and offline uncorrectable
#                   (198) sectors
#   -o on -S on     automatic offline data collection, attribute autosave
#   -R 5!           any growth of Reallocated_Sector_Ct is a warning
#   -W 0,50,55      log at 50 C, warning at 55 C (Seagate Exos: max 60 C)
#   -n standby,q    never spin up a sleeping disk for a check
#   -s ...          short self-test daily 05:00 UTC; long self-test Saturday
#                   01:00 UTC, the second disk 8 h later (:008) so that both
#                   disks are never in a long test at the same time
#   -m <nomailer> -M exec   no mail (no MTA): smartd-event.sh -> notify.sh
#   -M diminishing  repeat a warning after 1, 2, 4, 8, ... days while it holds
#
# Do not start a long self-test by hand while /proc/mdstat shows a resync or
# recovery (README, "Мониторинг -> SMART").
DEVICESCAN -d removable -n standby,q -a -o on -S on -R 5! -W 0,50,55 -s (S/../.././05|L/../../6/01:008) -m <nomailer> -M exec /opt/hoodchain-mev/deploy/smartd-event.sh -M diminishing
