# hoodchain-mev: smartd reads our config instead of the packaged
# /etc/smartd.conf (a dpkg conffile, left as shipped). Installed by
# bootstrap.sh as /etc/systemd/system/smartmontools.service.d/hood.conf.
# Same ExecStart as the package (Ubuntu 24.04 7.4, 26.04 7.5) plus -c;
# $smartd_opts (/etc/default/smartmontools) still works, empty by default.
[Service]
ExecStart=
ExecStart=/usr/sbin/smartd -n -c /etc/hoodchain/smartd.conf $smartd_opts
