# hoodchain-mev: mdadm --monitor hands every event to our notifier
# (deploy/mdadm-event.sh -> notify.sh -> journald + Telegram). Installed by
# bootstrap.sh as /etc/mdadm/mdadm.conf.d/hood.conf; mdadm reads this
# directory after /etc/mdadm/mdadm.conf. mdmonitor.service reads it at start
# (bootstrap restarts mdmonitor when this file changes). MAILADDR in the main
# file stays as is: there is no MTA on the host.
PROGRAM /opt/hoodchain-mev/deploy/mdadm-event.sh
