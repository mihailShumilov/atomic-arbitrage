# hoodchain-mev: one-shot test of the smartd -> smartd-event.sh -> notify.sh
# chain (one INFO per disk). Installed as /opt/hoodchain-mev/deploy/smartd-test.conf.
#
#   smartd -q onecheck -s - -c /opt/hoodchain-mev/deploy/smartd-test.conf
#
# -q onecheck: register the disks, check once, exit (the running daemon is not
# touched); -s -: no state files. No -s schedule here, so no self-test starts.
# -H: only the health status is checked (without it smartd implies -a); a
# failing disk would send its ALERT here too.
DEVICESCAN -d removable -n standby,q -H -m <nomailer> -M exec /opt/hoodchain-mev/deploy/smartd-event.sh -M test
