[package]
name = "enricher"
version = "0.1.0"
edition.workspace = true
# 1.89: std::fs::File::try_lock (out-dir lock that the OS releases even on kill -9).
rust-version = "1.89"
publish.workspace = true

[dependencies]
hood-core.workspace = true
decoders = { path = "../decoders" }
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
# raw_value: exact per-method response byte counts for the size statistics.
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true
reqwest.workspace = true

[dev-dependencies]
# test-util: `#[tokio::test(start_paused = true)]` for the rate limiter test
# (exact virtual time instead of real sleeps). Feature only, no new crate.
tokio = { workspace = true, features = ["test-util"] }
# tests/retry.rs: format an HTTP-date `Retry-After` for the mock server.
chrono.workspace = true
