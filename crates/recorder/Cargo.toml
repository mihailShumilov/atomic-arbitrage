[package]
name = "recorder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hood-core.workspace = true
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true
chrono.workspace = true
yawc.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
# Both already in Cargo.lock via yawc/rustls (no new crates downloaded).
# base64: non-text frames are stored base64-encoded (task 002, item 5).
base64 = "0.22"
# url: parse the feed URL for the manual TCP/TLS connect that keeps the
# HTTP response head (Retry-After), see src/net.rs.
url = "2"
